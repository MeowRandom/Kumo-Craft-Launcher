name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore .\Kumo.csproj --configfile .\NuGet.Config

      - name: Build
        run: dotnet build .\Kumo.csproj -c Release --no-restore

      - name: Test
        run: dotnet run --project .\tests\Kumo.SmokeTests\Kumo.SmokeTests.csproj -c Release --configfile .\tests\Kumo.SmokeTests\NuGet.Config
